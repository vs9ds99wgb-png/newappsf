<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram — Echo Bot (с удалением сообщений)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0e1117;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            width: 100%;
            overflow: hidden;
        }

        .telegram-app {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 700px;
            background: #17212b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border-radius: 0;
        }

        @media (min-width: 768px) {
            .telegram-app {
                max-width: 450px;
                border-radius: 20px;
                height: 85vh;
                box-shadow: 0 8px 28px rgba(0,0,0,0.5);
            }
        }

        .chat-header {
            padding: 14px 16px;
            background: #17212b;
            border-bottom: 1px solid #242f3d;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .back-button {
            font-size: 24px;
            color: #7e8c9e;
            cursor: pointer;
            display: block;
        }

        .chat-header-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #2b5278, #1d3a55);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-name {
            color: white;
            font-weight: 600;
            font-size: 17px;
        }

        .chat-header-status {
            color: #5ac73e;
            font-size: 13px;
        }

        .settings-icon {
            font-size: 22px;
            color: #7e8c9e;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .message-row {
            display: flex;
            margin-bottom: 4px;
            transition: opacity 0.2s;
        }

        .message-row.outgoing {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            cursor: pointer;
            transition: opacity 0.1s;
        }

        .outgoing .message-bubble {
            background: #2b5278;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .incoming .message-bubble {
            background: #242f3d;
            color: #e1e4e8;
            border-bottom-left-radius: 4px;
        }

        .message-text {
            word-break: break-word;
        }

        .file-attachment {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon {
            font-size: 32px;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            font-size: 13px;
            word-break: break-all;
        }

        .file-size {
            font-size: 11px;
            opacity: 0.7;
        }

        .input-panel {
            background: #17212b;
            padding: 10px 12px;
            border-top: 1px solid #242f3d;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .attach-btn {
            background: #242f3d;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: #7e8c9e;
            flex-shrink: 0;
        }

        .message-input {
            flex: 1;
            background: #242f3d;
            border: none;
            padding: 12px 16px;
            border-radius: 28px;
            color: white;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        .message-input::placeholder {
            color: #7e8c9e;
        }

        .send-btn {
            background: #2b5278;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        input[type="file"] {
            display: none;
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background: #17212b;
            z-index: 1000;
            transition: right 0.3s ease;
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: -2px 0 12px rgba(0,0,0,0.4);
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #242f3d;
        }

        .close-settings {
            font-size: 28px;
            cursor: pointer;
            color: #7e8c9e;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #242f3d;
        }

        .theme-toggle {
            background: #2b5278;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .sidebar {
            position: fixed;
            left: -85%;
            top: 0;
            width: 85%;
            max-width: 300px;
            height: 100%;
            background: #17212b;
            z-index: 1001;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #242f3d;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 18px 16px;
            border-bottom: 1px solid #242f3d;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }

        .chat-item.active {
            background: #2b5278;
        }

        .chat-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #2b5278, #1d3a55);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            color: white;
        }

        .chat-preview {
            font-size: 13px;
            color: #7e8c9e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        /* Toast-уведомление */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #2b5278;
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 1100;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="telegram-app">
    <div class="chat-header">
        <div class="back-button" id="menuBtn">☰</div>
        <div class="chat-header-avatar" id="currentChatAvatar">🤖</div>
        <div class="chat-header-info">
            <div class="chat-header-name" id="currentChatName">Echo Bot</div>
            <div class="chat-header-status">в сети</div>
        </div>
        <div class="settings-icon" id="settingsBtn">⚙️</div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="input-panel">
        <label class="attach-btn" id="attachBtn">📎</label>
        <input type="file" id="fileInput" accept="image/*,video/*,application/pdf,.txt,.doc,.docx">
        <input type="text" class="message-input" id="messageInput" placeholder="Сообщение" autocomplete="off">
        <div class="send-btn" id="sendBtn">➤</div>
    </div>
</div>

<div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
        <h3>Настройки</h3>
        <div class="close-settings" id="closeSettingsBtn">✕</div>
    </div>
    <div class="setting-item">
        <span>🌙 Тёмная тема</span>
        <div class="theme-toggle" id="themeToggle">Вкл</div>
    </div>
    <div class="setting-item">
        <span>🔊 Звук уведомлений</span>
        <div class="theme-toggle" id="soundToggle">Вкл</div>
    </div>
    <div class="setting-item">
        <span>🤖 Режим эхо</span>
        <div class="theme-toggle" id="echoToggle">Вкл</div>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div style="background:#242f3d; padding:8px 12px; border-radius:24px; color:#7e8c9e;">🔍 Поиск</div>
    </div>
    <div class="chat-list" id="chatList"></div>
</div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast">Сообщение удалено</div>

<script>
    // Данные чатов
    let chatsData = {
        echo: { name: "Echo Bot", avatar: "🤖", messages: [{ text: "Привет! Я повторяю всё: текст, фото, файлы. Зажми любое сообщение, чтобы удалить.", isOutgoing: false, file: null }] },
        friend: { name: "Анна", avatar: "👤", messages: [{ text: "Привет! Как дела?", isOutgoing: false, file: null }] },
        work: { name: "Работа", avatar: "💼", messages: [{ text: "Встреча в 15:00", isOutgoing: false, file: null }] }
    };

    let currentChat = "echo";
    let echoEnabled = true;
    let isDarkTheme = true;
    let soundEnabled = true;

    const messagesContainer = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const currentChatName = document.getElementById('currentChatName');
    const currentChatAvatar = document.getElementById('currentChatAvatar');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const themeToggle = document.getElementById('themeToggle');
    const soundToggle = document.getElementById('soundToggle');
    const echoToggle = document.getElementById('echoToggle');
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const chatListDiv = document.getElementById('chatList');
    const toast = document.getElementById('toast');

    function showToast(msg) {
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 1500);
    }

    function getTime() { return new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' }); }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    // Удаление сообщения по индексу
    function deleteMessage(chatId, index) {
        chatsData[chatId].messages.splice(index, 1);
        if(chatId === currentChat) renderMessages();
        showToast('Сообщение удалено');
        // Обновляем превью в списке чатов
        const lastMsg = chatsData[chatId].messages[chatsData[chatId].messages.length-1];
        const previewDiv = document.querySelector(`.chat-item[data-chat="${chatId}"] .chat-preview`);
        if(previewDiv) previewDiv.textContent = lastMsg?.text?.slice(0,25) || (lastMsg?.file ? '📎 Файл' : '');
    }

    function renderMessages() {
        messagesContainer.innerHTML = '';
        const messages = chatsData[currentChat].messages;
        messages.forEach((msg, idx) => {
            const row = document.createElement('div');
            row.className = `message-row ${msg.isOutgoing ? 'outgoing' : 'incoming'}`;
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            if(msg.file) {
                bubble.innerHTML = `<div class="file-attachment"><div class="file-icon">📄</div><div class="file-info"><div class="file-name">${escapeHtml(msg.file.name)}</div><div class="file-size">${(msg.file.size/1024).toFixed(1)} KB</div></div></div>`;
            } else {
                bubble.innerHTML = `<div class="message-text">${escapeHtml(msg.text)}</div>`;
            }
            row.appendChild(bubble);
            
            // Долгое нажатие для удаления (работает и на телефоне, и на ПК)
            let pressTimer;
            row.addEventListener('touchstart', (e) => {
                pressTimer = setTimeout(() => {
                    if(confirm(`Удалить это сообщение?`)) {
                        deleteMessage(currentChat, idx);
                    }
                }, 500);
            });
            row.addEventListener('touchend', () => { clearTimeout(pressTimer); });
            row.addEventListener('touchmove', () => { clearTimeout(pressTimer); });
            // Для мыши (ПК) — долгое нажатие
            row.addEventListener('mousedown', (e) => {
                pressTimer = setTimeout(() => {
                    if(confirm(`Удалить это сообщение?`)) {
                        deleteMessage(currentChat, idx);
                    }
                }, 500);
            });
            row.addEventListener('mouseup', () => { clearTimeout(pressTimer); });
            row.addEventListener('mouseleave', () => { clearTimeout(pressTimer); });
            
            messagesContainer.appendChild(row);
        });
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addMessage(chatId, text, isOutgoing, file=null) {
        chatsData[chatId].messages.push({ text, isOutgoing, file });
        if(chatId === currentChat) renderMessages();
        const previewDiv = document.querySelector(`.chat-item[data-chat="${chatId}"] .chat-preview`);
        if(previewDiv) previewDiv.textContent = text ? (text.length>30?text.slice(0,30)+'...':text) : (file ? '📎 Фото/файл' : '');
    }

    function renderChatList() {
        chatListDiv.innerHTML = '';
        for(let [id, data] of Object.entries(chatsData)) {
            const div = document.createElement('div');
            div.className = `chat-item ${currentChat===id ? 'active' : ''}`;
            div.setAttribute('data-chat', id);
            const lastMsg = data.messages[data.messages.length-1];
            div.innerHTML = `<div class="chat-avatar">${data.avatar}</div><div class="chat-info"><div class="chat-name">${data.name}</div><div class="chat-preview">${lastMsg?.text?.slice(0,25) || (lastMsg?.file ? '📎 Файл' : '')}</div></div>`;
            div.onclick = () => { switchChat(id); closeSidebar(); };
            chatListDiv.appendChild(div);
        }
    }

    function switchChat(chatId) {
        currentChat = chatId;
        currentChatName.textContent = chatsData[chatId].name;
        currentChatAvatar.textContent = chatsData[chatId].avatar;
        renderChatList();
        renderMessages();
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if(!text) return;
        addMessage(currentChat, text, true);
        if(currentChat === 'echo' && echoEnabled) setTimeout(() => addMessage(currentChat, text, false), 200);
        messageInput.value = '';
    }

    function sendFile(file) {
        if(!file) return;
        addMessage(currentChat, '', true, file);
        if(currentChat === 'echo' && echoEnabled) setTimeout(() => addMessage(currentChat, '', false, file), 300);
    }

    function openSidebar() { sidebar.style.left = '0'; overlay.style.display = 'block'; }
    function closeSidebar() { sidebar.style.left = '-85%'; overlay.style.display = 'none'; }

    function setTheme(dark) {
        document.body.style.background = dark ? '#0e1117' : '#e8eef2';
        document.querySelector('.telegram-app').style.background = dark ? '#17212b' : '#ffffff';
        themeToggle.textContent = dark ? 'Вкл' : 'Выкл';
    }

    menuBtn.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => { if(e.target.files.length) sendFile(e.target.files[0]); fileInput.value = ''; });
    settingsBtn.onclick = () => settingsPanel.classList.add('open');
    closeSettingsBtn.onclick = () => settingsPanel.classList.remove('open');
    themeToggle.onclick = () => { isDarkTheme = !isDarkTheme; setTheme(isDarkTheme); };
    soundToggle.onclick = () => { soundEnabled = !soundEnabled; soundToggle.textContent = soundEnabled ? 'Вкл' : 'Выкл'; };
    echoToggle.onclick = () => { echoEnabled = !echoEnabled; echoToggle.textContent = echoEnabled ? 'Вкл' : 'Выкл'; };

    renderChatList();
    renderMessages();
    setTheme(true);
</script>
</body>
</html>
